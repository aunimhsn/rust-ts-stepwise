name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its runs that are still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request that changes only documentation runs no check: the jobs below are then
  # skipped rather than left out, so that the workflow still ends with the job `CI`.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust: &rust
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'rust-toolchain.toml'
              # The level files, read and checked by `cargo test`.
              - 'web/levels/**'
              - '.github/workflows/**'
              - '.github/actions/**'
            # The interface loads the core: a change of the Rust code checks it too.
            web:
              - *rust
              - 'web/**'

  check:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # The bridge as the browser loads it: the code behind `cfg(target_arch = "wasm32")`
      # is only checked for this target.
      - run: cargo clippy --locked --workspace --all-features --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked --workspace --all-features

  msrv:
    name: Rust minimum version
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # `+version` overrides the stable channel of rust-toolchain.toml.
      - run: cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-targets --all-features
      - run: cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-features --target wasm32-unknown-unknown

  web:
    name: Interface
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The one check the ruleset of `main` requires: it fails when a job above failed or was
  # cancelled, and passes when they passed or were skipped. A skipped job alone would count
  # as passed, even when skipped because the job `changes` failed; and the jobs above can be
  # renamed or added without touching the ruleset.
  ci:
    name: CI
    needs: [changes, check, msrv, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of the jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
