name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its runs that are still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # The bridge as the browser loads it: the code behind `cfg(target_arch = "wasm32")`
      # is only checked for this target.
      - run: cargo clippy --locked --workspace --all-features --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked --workspace --all-features

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # `+version` overrides the stable channel of rust-toolchain.toml.
      - run: cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-targets --all-features
      - run: cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-features --target wasm32-unknown-unknown
