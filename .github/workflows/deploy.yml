name: Deploy

# Every merge into `main` publishes the website to GitHub Pages (see docs/github-pages-usage.md).
# It builds again rather than wait for the workflow CI: the code merged already passed its checks
# in the pull request, which the ruleset of `main` requires.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; one in progress finishes rather than leave the website half published,
# and only the latest waiting one runs after it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The address of the website, set in Settings › Pages: its path is empty at the root of a
      # domain, `/rust-ts-stepwise` at the default address of GitHub Pages.
      - uses: actions/configure-pages@v6
        id: pages
      - uses: ./.github/actions/setup-web
      - name: Build the website
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
