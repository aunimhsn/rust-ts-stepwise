# A trial level for the tests of the core (see ../programs.rs), not a level of the website: the
# square of the example of specs.md, on two maps.
version = 1

starting_code = '''
# Paint a square of side 3
'''

[[maps]]
terrain = '''
......
......
......
......
......
'''
robot = { at = [1, 1], facing = "east" }

[maps.goals]
paints = [
    { color = "red", path = [[1, 1], [2, 1], [3, 1], [4, 1], [4, 2], [4, 3], [4, 4], [3, 4], [2, 4], [1, 4], [1, 3], [1, 2], [1, 1]] },
]
nothing_else_painted = true

[[maps]]
terrain = '''
.....
.....
.....
.....
'''
robot = { at = [4, 0], facing = "south" }

[maps.goals]
paints = [
    { color = "red", path = [[4, 0], [4, 1], [4, 2], [4, 3], [3, 3], [2, 3], [1, 3], [1, 2], [1, 1], [1, 0], [2, 0], [3, 0], [4, 0]] },
]
nothing_else_painted = true
