[package]
name = "stepwise"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Learn to program step by step by writing programs that drive a robot, in the browser."
authors = ["Aunim HASSAN"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aunimhsn/rust-ts-stepwise"
readme = "README.md"
# An application, never published on crates.io.
publish = false

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
